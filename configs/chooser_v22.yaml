# The member chooser of the shipped family (prior v2.2): trained on the two v2.2 corpora, reading the present-day
# temperature T_0 as the members do, so its logit is log p(x | T_0, 250) - log p(x | T_0, 100).
corpora: [data/corpus_v22_100.h5, data/corpus_v22_250.h5]
members: [100, 250]
present_input: true
observation: configs/observation_v2.yaml

effort:                              # RJ's laboratory ranges, 2026-09-26
  n_grains_counted: [20, 50]
  area_per_grain_um2: [1000.0, 6000.0]
  n_lengths: [40, 150]
  n_he_grains: null
  p_no_lengths: 0.30
  p_no_aft: 0.20
  p_no_he: 0.30

encoder:
  d_embed: 256
  d_hidden: 256
  d_grain: 128
  d_hist: 64
  n_trunk: 3
  hist_pool: 2                       # 100 bins of 0.2 um
d_hidden: 256

batch_size: 4096                     # 2 048 rows from each corpus
steps: 20000
lr: 0.001
lr_min: 0.00001
warmup: 500
weight_decay: 0.0
grad_clip: 10.0
val_every: 1000
val_rows: 50000
val_seed: 12345
num_workers: 6                       # per corpus
seed: 0
