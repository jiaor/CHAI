# The shipped 100 Ma member (prior v2.2, configs/prior_v22.yaml): 3 M histories, 200 000 steps of 4 096 rows
# (~341 passes over the training rows), a 1.0 K noise floor on the target that the API takes back out at
# inference (remove_floor), 12 coupling layers of 8 bins, snapshots from 150k, seed 0.  The shipped weights are
# the 200k snapshot (results/flow_v22_100/model_200k.pt) with meta["remove_floor"] set.
corpus: data/corpus_v22_100.h5
latent: data/latent_v22_100.pt
observation: configs/observation_v2.yaml

effort:                              # RJ's laboratory ranges, 2026-09-26
  n_grains_counted: [20, 50]
  area_per_grain_um2: [1000.0, 6000.0]
  n_lengths: [40, 150]
  n_he_grains: null
  p_no_lengths: 0.30
  p_no_aft: 0.20
  p_no_he: 0.30

encoder:
  d_embed: 256
  d_hidden: 256
  d_grain: 128
  d_hist: 64
  n_trunk: 3
  hist_pool: 2                       # 100 bins of 0.2 um
head:
  kind: flow
  n_layers: 12
  n_bins: 8
  d_hidden: 256
  n_hidden: 2
  tail_bound: 5.0                    # base units; identity outside
  base: student_t                    # learned df per coordinate
  df_init: 30.0
  df_min: 2.5
  affine_hidden: 256
  min_scale: 0.001
dequantise:                          # the pulse prior has no walls: only a noise floor
  width: 0.0
  jitter: 0.0
  noise_sd: 1.0                       # taken back out at inference (remove_floor)

batch_size: 4096
steps: 200000                       # with snapshots from 150 000 to compare lengths
save_every: 10000                   # model_150k.pt, model_160k.pt, ... model_200k.pt (model.pt stays the best)
save_from: 150000
lr: 0.001
lr_min: 0.00001
warmup: 500
weight_decay: 0.0
grad_clip: 10.0
val_every: 1000
val_rows: 50000
val_seed: 12345
num_workers: 8
seed: 0
n_diag_samples: 64
